<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="{{csp}}"><link rel="stylesheet" href="{{css}}"><title>AS Compatible Copilot</title></head><body><header><div><p class="eyebrow">AS COMPATIBLE COPILOT</p><h1>Provider control center</h1><p class="muted">Manage endpoints, credentials, models, and Copilot behavior.</p></div><button id="refresh" class="secondary">Refresh</button></header><main><section><div class="section-title"><h2>Global settings</h2><span id="status" class="status">Loading</span></div><div class="grid settings"><label>Reasoning effort<select id="reasoning"><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option></select></label><label>Context length<input id="context" type="number" min="1"></label></div><button id="saveSettings">Save settings</button></section><section><div class="section-title"><h2>Provider profiles</h2><button id="newProfile">Add provider</button></div><div id="profiles" class="list"></div><form id="profileForm" hidden><h3>Provider profile</h3><div class="grid"><label>Profile ID<input name="id" required></label><label>Provider<select name="provider"><option>openai-compatible</option><option>openai-responses</option><option>anthropic</option><option>google</option></select></label><label class="wide">Base URL<input name="baseURL" placeholder="https://api.example.com/v1"></label><label class="wide">API key <span class="secret">stored securely</span><input name="apiKey" type="password" autocomplete="new-password"></label></div><div class="actions"><button>Save provider</button><button type="button" id="cancelProfile" class="secondary">Cancel</button></div></form></section><section><div class="section-title"><h2>Models</h2><button id="newModel">Add model</button></div><div id="models" class="list"></div><form id="modelForm" hidden><h3>Model configuration</h3><div class="grid"><label>Unique ID<input name="id" required></label><label>Provider<select name="provider"><option>openai-compatible</option><option>openai-responses</option><option>anthropic</option><option>google</option></select></label><label>Model name<input name="model" required></label><label>Display name<input name="name"></label><label>Context override<input name="contextLength" type="number" min="1"></label><label>Max output tokens<input name="maxOutputTokens" type="number" min="1"></label><label>Tools<select name="toolCalling"><option value="">Inherit</option><option value="true">Enabled</option><option value="false">Disabled</option></select></label><label>Images<select name="imageInput"><option value="">Inherit</option><option value="true">Enabled</option><option value="false">Disabled</option></select></label><label class="wide">Base URL<input name="baseURL"></label></div><div class="actions"><button>Save model</button><button type="button" id="cancelModel" class="secondary">Cancel</button></div></form></section></main><div id="error" role="alert"></div><script nonce="{{nonce}}" src="{{js}}"></script></body></html>
